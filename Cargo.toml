[workspace]
members = [
    "ners-core",
    "ners-proto-http",
    "ners-metrics",
]
resolver = "2"

[workspace.dependencies]
bytes = "1.5"
log = "0.4"
env_logger = "0.10"
criterion = "0.5"
thiserror = "1.0"
crossbeam = "0.8"
nix = { version = "0.29", features = ["net", "sched"] }
libc = "0.2"
parking_lot = "0.12"
