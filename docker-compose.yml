version: '3.8'

services:
  ners:
    build:
      context: .
      dockerfile: Dockerfile
    image: ners:latest
    container_name: ners-server
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info
      - NERS_PORT=8080
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 1G
        reservations:
          cpus: '2'
          memory: 512M
